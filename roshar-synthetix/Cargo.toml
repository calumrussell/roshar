[package]
name = "roshar-synthetix"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "synthetix perps exchange client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
roshar-http = { version = "0.1.0", path = "../roshar-http" }
roshar-ws-mgr = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Same major as roshar-http, whose RateLimitedClient hands back this Response type.
reqwest = { version = "0.11", default-features = false }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
