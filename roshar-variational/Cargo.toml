[package]
name = "roshar-variational"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Variational Omni read-only market statistics client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
roshar-http = { version = "0.1.0", path = "../roshar-http" }
serde_json = "1.0"
