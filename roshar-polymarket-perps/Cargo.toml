[package]
name = "roshar-polymarket-perps"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Polymarket Perps (perpetuals) exchange client for Roshar: market data, proxy-key signing and trading"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
reqwest = "0.11"
rmp = "0.8"
roshar-http = { version = "0.1.0", path = "../roshar-http" }
roshar-ws-mgr = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
