[package]
name = "roshar-bybit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "bybit exchange client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = "0.4"
hex = "0.4"
hmac = "0.12"
roshar-http = { version = "0.1.0", path = "../roshar-http" }
roshar-types = { workspace = true }
roshar-ws-mgr = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
