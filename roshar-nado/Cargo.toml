[package]
name = "roshar-nado"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "nado exchange client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
# Same major as roshar-http's reqwest. Enabling `gzip` makes the shared reqwest 0.11 client send
# `Accept-Encoding: gzip` and decode the reply; Nado's gateway and archive answer HTTP 403 without it.
reqwest = { version = "0.11", features = ["json", "gzip"] }
roshar-http = { version = "0.1.0", path = "../roshar-http" }
roshar-ws-mgr = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha3 = "0.10"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
