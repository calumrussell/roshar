[package]
name = "roshar-pacifica"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "pacifica exchange client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bs58 = "0.5"
ed25519-dalek = "2"
anyhow = "1.0"
async-trait = "0.1"
roshar-http = { version = "0.1.0", path = "../roshar-http" }
roshar-ws-mgr = { workspace = true }
serde_json = "1.0"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
