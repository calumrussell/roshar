[package]
name = "roshar-hyperliquid"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Hyperliquid exchange client for Roshar: signing, order posting, user streams, info queries"
repository = "https://github.com/calumrussell/roshar"

[features]
default = []
# ws_config() for roshar-ws-mgr consumers. Off by default so order-path users don't pull in ws-mgr's TLS stack.
ws-mgr = ["dep:roshar-ws-mgr"]

[dependencies]
roshar-ws-mgr = { workspace = true, optional = true }
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hex = "0.4"
parking_lot = "0.12"
k256 = { version = "0.13", features = ["ecdsa"] }
sha3 = "0.10"
rmp = "0.8"
leaky-bucket = "1.0"
# fastAssetCtxs payloads: base64 of raw DEFLATE.
base64 = "0.22"
flate2 = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
