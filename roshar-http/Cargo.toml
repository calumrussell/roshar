[package]
name = "roshar-http"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared HTTP transport (pooled reqwest client, leaky-bucket rate limiting) for Roshar exchange crates"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
reqwest = { version = "0.11", features = ["json"] }
leaky-bucket = "1.0"
