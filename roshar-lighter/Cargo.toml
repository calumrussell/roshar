[package]
name = "roshar-lighter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "lighter exchange client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
roshar-http = { version = "0.1.0", path = "../roshar-http" }
roshar-types = { workspace = true }
roshar-ws-mgr = { workspace = true }
serde_json = "1.0"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
getrandom = "0.2"
hex = "0.4"
bytes = "1"
num-bigint = "0.4"
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
