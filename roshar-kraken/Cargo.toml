[package]
name = "roshar-kraken"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "kraken exchange client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
hmac = "0.12"
reqwest = { version = "0.11", features = ["json"] }
roshar-http = { version = "0.1.0", path = "../roshar-http" }
roshar-types = { workspace = true }
roshar-ws-mgr = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
