[package]
name = "roshar-paradex"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "paradex exchange client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
async-trait = "0.1"
roshar-http = { version = "0.1.0", path = "../roshar-http" }
roshar-ws-mgr = { workspace = true }
serde_json = "1.0"
starknet-crypto = "0.8.1"
sha3 = "0.10"
# Same major as roshar-http, whose request builders this crate fills in.
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
