[package]
name = "roshar-polymarket"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "polymarket exchange client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
anyhow = "1.0"
roshar-ws-mgr = { workspace = true }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.11", features = ["json", "gzip"] }
roshar-http = { version = "0.1.0", path = "../roshar-http" }
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
