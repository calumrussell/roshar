[package]
name = "roshar-deribit"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "deribit exchange client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
# `raw_value` lets notifications and RPC responses be routed before their payload is parsed.
serde_json = { version = "1.0", features = ["raw_value"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
async-trait = "0.1"
roshar-http = { version = "0.1.0", path = "../roshar-http" }
roshar-ws-mgr = { workspace = true }

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
