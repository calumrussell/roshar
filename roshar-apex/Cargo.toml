[package]
name = "roshar-apex"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ApeX Omni exchange client for Roshar"
repository = "https://github.com/calumrussell/roshar"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
# Same major as roshar-http, whose RateLimitedClient builds these requests.
reqwest = { version = "0.11", features = ["json"] }
roshar-http = { version = "0.1.0", path = "../roshar-http" }
roshar-ws-mgr = { workspace = true }
rust_decimal = "1.36"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
